services:
  gateway:
    build:
      context: ./backend
      dockerfile: services/gateway/Dockerfile
    container_name: semcachelm-gateway
    restart: unless-stopped
    command: ["uvicorn", "services.gateway.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_ENV: development
      APP_VERSION: 1.0.0
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_HTTPS: ${QDRANT_HTTPS:-false}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL: ${REDIS_SSL:-false}
      AI_SERVICE_BASE_URL: http://ai:8004
      CACHE_SERVICE_BASE_URL: http://cache:8002
      RAG_SERVICE_BASE_URL: http://rag:8001
      ANALYTICS_SERVICE_BASE_URL: http://analytics:8003
      ORCHESTRATOR_SERVICE_BASE_URL: http://orchestrator:8005
      STREAM_WORKERS_ENABLED: "true"
      ANALYTICS_STREAM_CONSUMER_ENABLED: "true"
      ANALYTICS_VIA_STREAM: "true"
      GATEWAY_SYNC_QUERY_ENABLED: "false"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-gemini-2.5-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
    ports:
      - "8000:8000"
    depends_on:
      ai:
        condition: service_started
      cache:
        condition: service_started
      rag:
        condition: service_started
      analytics:
        condition: service_started
      orchestrator:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/metrics > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  rag:
    build:
      context: ./backend
      dockerfile: services/rag/Dockerfile
    container_name: semcachelm-rag
    restart: unless-stopped
    command: ["uvicorn", "services.rag.app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      APP_ENV: development
      APP_VERSION: 1.0.0
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_HTTPS: ${QDRANT_HTTPS:-false}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL: ${REDIS_SSL:-false}
      RAG_REPO_CACHE_DIR: /data/rag_repo_cache
      RAG_CATALOG_DIR: /data/rag_catalog
      RAG_QDRANT_HOST: ${RAG_QDRANT_HOST:-qdrant}
      RAG_QDRANT_PORT: ${RAG_QDRANT_PORT:-6333}
      RAG_QDRANT_API_KEY: ${RAG_QDRANT_API_KEY:-}
      RAG_QDRANT_HTTPS: ${RAG_QDRANT_HTTPS:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-gemini-2.5-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-120}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    volumes:
      - rag_data:/data
    ports:
      - "8001:8001"
    depends_on:
      ai:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8001/metrics > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 180s

  cache:
    build:
      context: ./backend
      dockerfile: services/cache/Dockerfile
    container_name: semcachelm-cache
    restart: unless-stopped
    command: ["uvicorn", "services.cache.app.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      APP_ENV: development
      APP_VERSION: 1.0.0
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_HTTPS: ${QDRANT_HTTPS:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL: ${REDIS_SSL:-true}
      STREAM_WORKERS_ENABLED: "true"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    ports:
      - "8002:8002"
    depends_on:
      ai:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8002/metrics > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  analytics:
    build:
      context: ./backend
      dockerfile: services/analytics/Dockerfile
    container_name: semcachelm-analytics
    restart: unless-stopped
    command: ["uvicorn", "services.analytics.app.main:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      APP_ENV: development
      APP_VERSION: 1.0.0
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL: ${REDIS_SSL:-false}
      ANALYTICS_STREAM_CONSUMER_ENABLED: "true"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8003/metrics > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  ai:
    build:
      context: ./backend
      dockerfile: services/ai/Dockerfile
    container_name: semcachelm-ai
    restart: unless-stopped
    command: ["uvicorn", "services.ai.app.main:app", "--host", "0.0.0.0", "--port", "8004"]
    environment:
      APP_ENV: development
      APP_VERSION: 1.0.0
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL: ${REDIS_SSL:-false}
      STREAM_WORKERS_ENABLED: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-gemini-2.5-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-120}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      # Optional: corporate proxy (httpx reads these when set)
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8004/metrics > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  orchestrator:
    build:
      context: ./backend
      dockerfile: services/orchestrator/Dockerfile
    container_name: semcachelm-orchestrator
    restart: unless-stopped
    command: ["uvicorn", "services.orchestrator.app.main:app", "--host", "0.0.0.0", "--port", "8005"]
    environment:
      APP_ENV: development
      APP_VERSION: 1.0.0
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL: ${REDIS_SSL:-false}
      AI_SERVICE_BASE_URL: http://ai:8004
      CACHE_SERVICE_BASE_URL: http://cache:8002
      RAG_SERVICE_BASE_URL: http://rag:8001
      ANALYTICS_VIA_STREAM: "true"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    ports:
      - "8005:8005"
    depends_on:
      ai:
        condition: service_started
      cache:
        condition: service_started
      rag:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8005/metrics > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s



  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: semcachelm-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: semcachelm-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      gateway:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      cache:
        condition: service_healthy
      ai:
        condition: service_healthy
      rag:
        condition: service_healthy
      analytics:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: semcachelm-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  rag_data:
